version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL 16 Relational Database Engine
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: township-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-township_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-township_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - township-network

  # ============================================================================
  # 2. Spring Boot Backend Microservice
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: township-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-township_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/opt/township-backend/uploads
    networks:
      - township-network

  # ============================================================================
  # 3. React + Vite Frontend (Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: township-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - township-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  township-network:
    driver: bridge
